name: Check License URLs

on:
  schedule:
    - cron: "45 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check license URLs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2

      - name: Check that every license_url returns 200
        run: uv run .github/workflows/build_registry.py --check-license-urls
