name: Nightly Protocol Matrix

on:
  schedule:
    # Run nightly at 05:00 UTC
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      agents:
        description: "Comma-separated agent IDs (optional)"
        required: false
        default: ""
        type: string
      skip_agents:
        description: "Comma-separated agent IDs to skip (optional)"
        required: false
        default: ""
        type: string
      table_mode:
        description: "Main markdown table mode"
        required: false
        default: capabilities
        type: choice
        options:
          - capabilities
          - full
      changed_only:
        description: "Probe only changed agent versions"
        required: false
        default: false
        type: boolean
      create_pr:
        description: "Create or update a pull request with the results"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Generate GitHub token
        uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf
        id: generate-token
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ steps.generate-token.outputs.token }}

      - name: Build registry tools image
        run: docker build -f docker/registry-tools.Dockerfile -t acp-registry-tools .

      - name: Generate matrix in container
        env:
          ACP_REGISTRY_BUILD_IMAGE: "0"
        run: |
          AGENTS_INPUT=""
          SKIP_INPUT="crow-cli"
          TABLE_MODE="capabilities"
          CHANGED_ONLY="false"

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            AGENTS_INPUT="${{ inputs.agents }}"
            SKIP_INPUT="${{ inputs.skip_agents }}"
            TABLE_MODE="${{ inputs.table_mode }}"
            CHANGED_ONLY="${{ inputs.changed_only }}"
          fi

          ARGS=(
            --init-timeout 45
            --rpc-timeout 5
            --table-mode "$TABLE_MODE"
          )

          if [ "$CHANGED_ONLY" = "true" ]; then
            ARGS+=(--changed-only)
          fi

          if [ -n "$AGENTS_INPUT" ]; then
            ARGS+=(--agent "$AGENTS_INPUT")
          fi

          if [ -n "$SKIP_INPUT" ]; then
            export ACP_PROTOCOL_MATRIX_SKIP_AGENTS="$SKIP_INPUT"
          fi

          scripts/run-protocol-matrix.sh "${ARGS[@]}"

      - name: Summarize matrix run
        id: summary
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path('.protocol-matrix/latest.json').read_text())
          summary = data.get('summary', {})

          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f"report_date={data.get('date', '')}", file=output)
              print(
                  f"agents_probed_this_run={summary.get('agentsProbedThisRun', 0)}",
                  file=output,
              )
              print(f"agents_reused={summary.get('agentsReused', 0)}", file=output)
              print(
                  f"initialize_success={summary.get('initializeSuccess', 0)}",
                  file=output,
              )
              print(
                  f"session_new_auth_required={summary.get('sessionNewAuthRequired', 0)}",
                  file=output,
              )
          PY

      - name: Create or update pull request
        if: >-
          steps.summary.outputs.agents_probed_this_run != '0' &&
          (github.event_name == 'schedule' || inputs.create_pr == true || inputs.create_pr == 'true')
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.generate-token.outputs.token }}
          commit-message: "docs: update protocol matrix"
          committer: acp-release[bot] <2373403+acp-release[bot]@users.noreply.github.com>
          author: acp-release[bot] <2373403+acp-release[bot]@users.noreply.github.com>
          branch: automation/protocol-matrix
          delete-branch: true
          title: "docs: update protocol matrix for ${{ steps.summary.outputs.report_date }}"
          body: |
            Automated nightly protocol matrix refresh.

            - Date: `${{ steps.summary.outputs.report_date }}`
            - Agents probed this run: `${{ steps.summary.outputs.agents_probed_this_run }}`
            - Reused unchanged versions: `${{ steps.summary.outputs.agents_reused }}`
            - Initialize success: `${{ steps.summary.outputs.initialize_success }}`
            - `session/new` auth-required: `${{ steps.summary.outputs.session_new_auth_required }}`

            Generated by `.github/workflows/daily-protocol-matrix.yml`.
          add-paths: |
            .protocol-matrix/
