<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Caduceus: staff with wings and serpents -->
  <!-- Staff -->
  <rect x="7" y="1" width="2" height="14" rx="1" fill="currentColor"/>
  <!-- Wings left -->
  <path d="M7 4 C5 2, 1 2, 1 4 C3 3, 6 3, 7 5" fill="currentColor"/>
  <!-- Wings right -->
  <path d="M9 4 C11 2, 15 2, 15 4 C13 3, 10 3, 9 5" fill="currentColor"/>
  <!-- Left serpent -->
  <path d="M8 13 C4 11, 4 8, 6 7 C4 7, 3 10, 5 12 C3 9, 5 5, 8 5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Right serpent -->
  <path d="M8 13 C12 11, 12 8, 10 7 C12 7, 13 10, 11 12 C13 9, 11 5, 8 5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
</svg>
